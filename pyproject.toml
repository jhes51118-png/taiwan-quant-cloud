[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twquant"
version = "0.2.0"
description = "Taiwan equities screening and backtesting web app"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.24,<3", "streamlit>=1.60,<2", "plotly>=5.20,<7"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.50"]

[project.scripts]
twquant = "twquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
