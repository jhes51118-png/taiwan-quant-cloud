name: Bootstrap project
on:
  push:
    paths:
      - 'taiwan-quant-cloud.zip'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project source
        shell: bash
        run: |
          unzip -q taiwan-quant-cloud.zip -d _bootstrap
          cp -a _bootstrap/taiwan-quant/. ./
          rm -rf _bootstrap
          rm -f taiwan-quant-cloud.zip .github/workflows/bootstrap.yml .github/workflows/update.yml
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Taiwan Quant Cloud website source'
          git push
